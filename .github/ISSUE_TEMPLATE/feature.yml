name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: "What are you trying to do, and what gets in the way today?" }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What would help }
  - type: textarea
    id: safety
    attributes: { label: Safety, description: "Does this need an agent to do something it cannot do today? What should stay impossible?" }
